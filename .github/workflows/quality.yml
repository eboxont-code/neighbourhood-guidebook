name: SEWA Quality Gate

on:
  # Test the integration branch and reviewed changes only. Feature-branch
  # pushes are covered by the pull_request event once the work is proposed.
  # This avoids running the full two-job suite for every pre-PR commit.
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: sewa-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, lint, tests and production build
    runs-on: ubuntu-latest
    env:
      SUPABASE_PROJECT_ID: sewa-ci
      SUPABASE_URL: https://sewa-ci.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_sewa_ci_placeholder
      VITE_SUPABASE_PROJECT_ID: sewa-ci
      VITE_SUPABASE_URL: https://sewa-ci.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_sewa_ci_placeholder
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: TypeScript validation
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit and component tests
        run: npm run test

      - name: Production build
        run: npm run build

  database-migrations:
    name: Disposable PostgreSQL migration and security tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: sewa_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: sewa_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sewa_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Apply every migration and verify database security
        env:
          POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: bash scripts/ci/test-sewa-database.sh
